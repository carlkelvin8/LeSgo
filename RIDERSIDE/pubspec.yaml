name: lezgo_rider
description: "LezGo Rider — driver and merchant app."
publish_to: 'none'

version: 1.1.4+12

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Dependency Injection
  get_it: ^8.0.2

  # SVG Support
  flutter_svg: ^2.0.10+1

  # Image Picker
  image_picker: ^1.0.7
  cross_file: ^0.3.4+2

  # File Picker
  file_picker: ^8.0.0+1
  dotted_border: ^3.1.0
  fl_chart: ^1.1.1

  # Networking & Storage (Added for api_service.dart)
  dio: ^5.9.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Maps & Location
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1

  # JSON Serialization
  json_annotation: ^4.11.0
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.1.6
  pusher_reverb_flutter: ^0.0.7
  injectable: ^2.5.0
  local_auth: ^2.3.0
  google_generative_ai: ^0.4.6
  uuid: ^4.5.1
  qr_flutter: ^4.1.0

  # Audio
  just_audio: ^0.9.36

  # Shared package (DTOs, constants shared with Customer app)
  lesgo_shared:
    path: ../packages/lesgo_shared

  # PDF & Export
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  flutter_bluetooth_serial: 0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  
  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/affiliate.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/affiliate.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/register/
    - assets/images/wallet/
    - assets/images/mission/
    - assets/images/navbar/riderside/
    - assets/images/navbar/merchant/
    - assets/sounds/
    - assets/images/booking/

  fonts:
    - family: TT Fors
      fonts:
        - asset: assets/fonts/TT Fors Trial Regular.ttf
          weight: 400
        - asset: assets/fonts/TT Fors Trial Medium.ttf
          weight: 500
        - asset: assets/fonts/TT Fors Trial DemiBold.ttf
          weight: 600
        - asset: assets/fonts/TT Fors Trial Bold.ttf
          weight: 700
        - asset: assets/fonts/TT Fors Trial ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/TT Fors Trial Black.ttf
          weight: 900
        - asset: assets/fonts/TT Fors Trial Light.ttf
          weight: 300
        - asset: assets/fonts/TT Fors Trial ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/TT Fors Trial Thin.ttf
          weight: 100
