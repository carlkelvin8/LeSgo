# LeSGo Customer App - Analysis Options
# These rules enforce clean code without breaking existing features.
# Rules that would produce too many warnings on existing code are set to "info" level.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat these as warnings (not errors) so builds don't break
    unused_import: warning
    unused_local_variable: warning
    dead_code: info
    deprecated_member_use: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # Code style
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: false  # We use debugPrint instead, but don't break existing prints
    
    # Safety
    avoid_dynamic_calls: false  # Too many existing violations, enable later
    cancel_subscriptions: true
    close_sinks: true
    
    # Readability
    always_declare_return_types: true
    annotate_overrides: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    unnecessary_this: true
    unnecessary_new: true
    unnecessary_const: true
    unnecessary_string_interpolations: true
    
    # Imports
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    
    # Disabled (would break too much existing code)
    # public_member_api_docs: false
    # always_use_package_imports: false
